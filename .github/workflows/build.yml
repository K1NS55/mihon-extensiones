name: Compilar y publicar extensiones
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Instalar SDK
        run: bash scripts/setup-android.sh "$RUNNER_TEMP/android-sdk"
      - name: Probar publicador
        run: python3 -m unittest discover -s tests -v
      - name: Compilar y analizar las tres extensiones
        run: bash scripts/build.sh
      - name: Pruebas y análisis de bibliotecas compartidas
        run: ./gradlew --no-daemon --max-workers=4 :core:testDebugUnitTest :core:lintRelease :lib:i18n:lintRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-verificacion-no-publicar
          path: src/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: informes
          path: '**/build/reports/'

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Instalar SDK
        run: bash scripts/setup-android.sh "$RUNNER_TEMP/android-sdk"
      - name: Cargar clave privada
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: bash scripts/prepare-signing.sh
      - name: Compilar APK con firma estable
        env:
          ALIAS: mihon
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: bash scripts/build.sh
      - name: Verificar firma y generar índices
        run: |
          set -euo pipefail
          previous=()
          if git ls-remote --exit-code --heads origin repo > /dev/null; then
            git fetch origin repo
            mkdir previous
            git archive FETCH_HEAD | tar -x -C previous
            previous=(--previous previous/index.json)
          fi
          python3 scripts/publish_index.py --output dist --tag "$RELEASE_TAG" \
            --build-tools "$ANDROID_HOME/build-tools/37.0.0" "${previous[@]}"
      - name: Publicar APK e índices en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/apk/*.apk dist/index.json dist/repo.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Extensiones $RELEASE_TAG" \
            --notes 'APK firmados. El índice permanente se publica en la rama repo.'
      - name: Actualizar la rama de distribución
        run: |
          set -euo pipefail
          cd dist
          git init -b repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # Heredar la autenticación de checkout sin copiar ni imprimir credenciales.
          git config --local include.path "$GITHUB_WORKSPACE/.git/config"
          if git ls-remote --exit-code --heads origin repo > /dev/null; then
            git fetch origin repo
            git reset --soft FETCH_HEAD
          fi
          git add .
          git commit -m "Publicar $RELEASE_TAG"
          git push origin HEAD:repo
      - name: Eliminar clave del runner
        if: always()
        run: rm -f signingkey.jks
